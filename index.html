<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved/system theme before first paint (next-themes takes over after load). -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>
    
    <!-- Primary meta tags: the build writes each page's own, from src/lib/pages.ts -->
    <title>Tax ID Generator: EU VAT, NIF, CPF &amp; more | rtnogueira</title>
    <meta name="description" content="Free tax ID generator for QA testing: valid or invalid Portuguese NIFs, EU VAT numbers, CPF, CNPJ, ABN and other TINs. Copy or export to Excel, CSV or JSON." />
    <meta name="author" content="Tiago Nogueira" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://rtnogueira.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rtnogueira.com/" />
    <meta property="og:title" content="Tax ID Generator: EU VAT, NIF, CPF &amp; more | rtnogueira" />
    <meta property="og:description" content="Generate valid or deliberately invalid tax numbers for QA testing: Portuguese NIFs, EU VAT numbers, Brazilian CPF and CNPJ and more, with a matching validator." />
    <meta property="og:image" content="https://rtnogueira.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="rtnogueira – Tax ID Generator and Validator: NIFs, EU VAT numbers and more for QA testing" />
    <meta property="og:site_name" content="rtnogueira" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tax ID Generator: EU VAT, NIF, CPF &amp; more | rtnogueira" />
    <meta name="twitter:description" content="Generate valid or deliberately invalid tax numbers for QA testing: Portuguese NIFs, EU VAT numbers, Brazilian CPF and CNPJ and more, with a matching validator." />
    <meta name="twitter:image" content="https://rtnogueira.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="rtnogueira – Tax ID Generator and Validator: NIFs, EU VAT numbers and more for QA testing" />

    <!-- App -->
    <meta name="application-name" content="rtnogueira" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rtnogueira" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1797239821173252" crossorigin="anonymous"></script>

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="author" href="/humans.txt" />

    <!-- Structured data: written per page by the build, from src/lib/pages.ts -->
    <script type="application/ld+json"></script>
  </head>
